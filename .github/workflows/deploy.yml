# Deploys the theme, plugin and helper scripts to the demo VPS on every push to main.
# It replaces the manual "scp gka-deploy.zip + unzip + restart" routine in README.md.
#
# Repository secrets (Settings -> Secrets and variables -> Actions -> Secrets):
#   VPS_HOST          43.133.130.148
#   VPS_USER          ubuntu            (needs passwordless sudo: `sudo -n true` must succeed)
#   VPS_SSH_KEY       private key of a deploy-only key pair (public half in ~/.ssh/authorized_keys on the VPS)
#   VPS_KNOWN_HOSTS   output of `ssh-keyscan -H 43.133.130.148` (pins the server's host key)
# Optional repository variables (same page -> Variables):
#   VPS_PORT          default 22
#   DEMO_URL          default https://website.taufikandrian.my.id/gka
#
# Never touched on the server: /opt/gka/.env, the database volume, uploads, Caddy.
# Address changes (domain, /gka path, Caddy routes) are applied by running setup.sh once on the VPS.
name: Deploy demo

on:
  push:
    branches: [main]
    paths:
      - 'wp-content/**'
      - 'bin/**'
      - 'docker-compose.yml'
      - 'docker/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-demo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: PHP syntax
        run: find wp-content bin -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: theme.json is valid JSON
        run: php -r 'json_decode(file_get_contents("wp-content/themes/gka/theme.json"), false, 512, JSON_THROW_ON_ERROR);'
      - name: JS syntax
        run: for f in wp-content/themes/gka/assets/js/*.js; do node --check "$f"; done

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: demo
      url: ${{ vars.DEMO_URL || 'https://website.taufikandrian.my.id/gka' }}
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}
      DEMO_URL: ${{ vars.DEMO_URL || 'https://website.taufikandrian.my.id/gka' }}
    steps:
      - uses: actions/checkout@v5

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          [ -n "$VPS_HOST" ] && [ -n "$VPS_USER" ] && [ -n "$SSH_KEY" ] && [ -n "$KNOWN_HOSTS" ] \
            || { echo "::error::Set VPS_HOST, VPS_USER, VPS_SSH_KEY and VPS_KNOWN_HOSTS secrets"; exit 1; }
          install -m 700 -d ~/.ssh
          # Secrets pasted from Windows/web forms can carry CRs; OpenSSH rejects such key files.
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -P '' -f ~/.ssh/deploy_key > ~/.ssh/deploy_key.pub 2> /dev/null; then
            echo "::error::VPS_SSH_KEY is not a usable private key: paste the whole ~/.ssh/gka_deploy file (not the .pub), BEGIN/END lines included, created without a passphrase."
            exit 1
          fi
          echo "Deploy key fingerprint (must match a line of ~/.ssh/authorized_keys on the VPS):"
          ssh-keygen -lf ~/.ssh/deploy_key.pub
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host vps\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n  BatchMode yes\n  ConnectTimeout 20\n' "$VPS_HOST" "$VPS_USER" "$VPS_PORT" > ~/.ssh/config

          # Host key: VPS_KNOWN_HOSTS must contain an entry for exactly the VPS_HOST value (IP vs domain matters).
          lookup="$VPS_HOST"; [ "$VPS_PORT" = 22 ] || lookup="[$VPS_HOST]:$VPS_PORT"
          if ! ssh-keygen -F "$lookup" -f ~/.ssh/known_hosts > /dev/null; then
            echo "::error::VPS_KNOWN_HOSTS has no entry for the VPS_HOST value. Regenerate it with: ssh-keyscan -H -p $VPS_PORT <the exact VPS_HOST value>"
            exit 1
          fi
          if ! ssh vps true 2> ssh.err; then
            cat ssh.err
            if grep -q 'Host key verification failed\|REMOTE HOST IDENTIFICATION HAS CHANGED' ssh.err; then
              echo "Fingerprints in VPS_KNOWN_HOSTS:"; ssh-keygen -lf ~/.ssh/known_hosts || true
              echo "Fingerprints the server offers now:"; ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" 2>/dev/null | ssh-keygen -lf - || true
              echo "::error::Host key mismatch. If the fingerprints above are your server's, replace VPS_KNOWN_HOSTS with the output of: ssh-keyscan -H -p $VPS_PORT <VPS_HOST>"
            elif grep -q 'Permission denied' ssh.err; then
              echo "::error::The server refused VPS_SSH_KEY for user '$VPS_USER'. Its public key (below) must be in ~$VPS_USER/.ssh/authorized_keys on the VPS; compare fingerprints with: ssh-keygen -lf ~/.ssh/authorized_keys"
              cat ~/.ssh/deploy_key.pub
            else
              echo "::error::Could not reach $VPS_USER@VPS_HOST on port $VPS_PORT (see message above)."
            fi
            exit 1
          fi
          ssh vps 'sudo -n true' || { echo "::error::SSH works, but $VPS_USER needs passwordless sudo on the VPS"; exit 1; }

      - name: Sync files to /opt/gka
        run: |
          # Owned by www-data (33) like setup.sh leaves them; --delete removes files deleted in git.
          push_dir() { rsync -rlptz --delete --chown=33:33 --rsync-path='sudo rsync' "$1" "vps:/opt/gka/$2"; }
          push_dir wp-content/themes/gka/          wp-content/themes/gka/
          push_dir wp-content/plugins/gka-core/    wp-content/plugins/gka-core/
          push_dir bin/                            bin/
          push_dir docker/                         docker/
          rsync -ptz --rsync-path='sudo rsync' docker-compose.yml setup.sh Caddyfile.gka README.md vps:/opt/gka/

      - name: Restart WordPress
        run: ssh vps 'cd /opt/gka && sudo docker compose up -d db wordpress && sudo docker compose restart wordpress'

      - name: Smoke test
        run: |
          sleep 5
          fail=0
          for p in / /tentang-kami/ /bisnis-kami/ /esg/ /karir/ /hubungi-kami/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 4 --retry-all-errors "$DEMO_URL$p")
            printf '%-18s %s\n' "$p" "$code"
            [ "$code" = 200 ] || fail=1
          done
          exit $fail
