# WordPress is served at https://website.taufikandrian.my.id/gka/. Caddy forwards /gka/* with the
# prefix intact, so Apache maps it onto the WordPress root; REQUEST_URI keeps /gka, which is what
# WordPress expects when WP_HOME ends in /gka. Mounted into conf-enabled by docker-compose.yml.
Alias /gka /var/www/html
