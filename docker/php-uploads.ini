; Upload limits for the GKA WordPress container (mounted into PHP's conf.d by docker-compose.yml).
; WordPress reads these for "Maximum upload file size" in Media → Add New.
upload_max_filesize = 256M
; The whole request (file + form fields) must fit, so keep this a little above the file limit.
post_max_size = 264M
; Large uploads over a slow connection need time to arrive and to be processed.
max_input_time = 300
max_execution_time = 300
; Enough for WordPress to generate thumbnails of large photos. The container itself is capped
; by mem_limit in docker-compose.yml.
memory_limit = 256M
